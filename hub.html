<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPSE · Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --azul:   #10069F;
  --cyan:   #00B5E2;
  --rojo:   #DA291C;
  --verde:  #97D700;
  --amber:  #F59E0B;
  --bg:     #F4F5F9;
  --surface:#FFFFFF;
  --border: #E2E4EE;
  --text:   #1A1B2E;
  --muted:  #6B7280;
  --shadow: 0 2px 8px rgba(16,6,159,.08);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Fondo decorativo ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 10%, rgba(16,6,159,.07) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 85% 90%, rgba(0,181,226,.06) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ── Topbar ── */
.topbar {
  position: relative;
  z-index: 10;
  background: var(--azul);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 52px;
  box-shadow: 0 2px 12px rgba(16,6,159,.3);
  flex-shrink: 0;
}
.topbar-logo {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.3px;
}
.topbar-logo span { color: var(--cyan); }
.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-nombre {
  font-size: 13px;
  opacity: .8;
  font-weight: 500;
}
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--cyan);
  color: var(--azul);
  font-weight: 700;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.btn-salir {
  background: rgba(255,255,255,.15);
  border: none;
  color: #fff;
  border-radius: 7px;
  padding: 5px 12px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  font-weight: 500;
  transition: background .15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-salir:hover { background: rgba(255,255,255,.25); }
.btn-salir svg { width: 13px; height: 13px; }

/* ── Contenido central ── */
.hub-wrap {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}

.hub-greeting {
  text-align: center;
  margin-bottom: 40px;
}
.hub-greeting h1 {
  font-size: 26px;
  font-weight: 700;
  color: var(--azul);
  letter-spacing: -.4px;
  margin-bottom: 6px;
}
.hub-greeting p {
  font-size: 14px;
  color: var(--muted);
  font-weight: 500;
}

/* ── Cards de apps ── */
.apps-grid {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 680px;
  width: 100%;
}

.app-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 18px;
  padding: 32px 28px;
  width: 280px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: all .2s;
  box-shadow: 0 2px 12px rgba(16,6,159,.06);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0;
  position: relative;
  overflow: hidden;
}
.app-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--azul);
  transform: scaleX(0);
  transition: transform .2s;
  transform-origin: left;
}
.app-card:hover {
  border-color: var(--azul);
  box-shadow: 0 8px 32px rgba(16,6,159,.14);
  transform: translateY(-2px);
}
.app-card:hover::before {
  transform: scaleX(1);
}

.app-card-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
}
.app-card-icon svg {
  width: 26px;
  height: 26px;
}
.app-card-icon.agenda {
  background: #EEF0FF;
}
.app-card-icon.agenda svg { stroke: var(--azul); }

.app-card-icon.gestion {
  background: #fff8f0;
}
.app-card-icon.gestion svg { stroke: #b45309; }

.app-card-titulo {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  letter-spacing: -.3px;
}
.app-card-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 24px;
}
.app-card-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--azul);
  transition: gap .15s;
}
.app-card:hover .app-card-cta { gap: 10px; }
.app-card-cta svg { width: 14px; height: 14px; }

/* Card gestión — solo admins */
.app-card.gestion-card .app-card-cta { color: #b45309; }
.app-card.gestion-card::before { background: #b45309; }
.app-card.gestion-card:hover { border-color: #b45309; }

/* ── Estado de carga ── */
.loading-wrap {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
}
.spinner {
  width: 20px; height: 20px;
  border: 2.5px solid var(--border);
  border-top-color: var(--azul);
  border-radius: 50%;
  animation: spin .65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Footer ── */
.hub-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 16px;
  font-size: 11px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">IPSE <span>·</span> Inicio</div>
  <div class="topbar-right">
    <span class="topbar-nombre" id="topbar-nombre"></span>
    <div class="avatar" id="topbar-avatar">–</div>
    <button class="btn-salir" onclick="cerrarSesion()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Salir
    </button>
  </div>
</div>

<!-- CARGANDO -->
<div class="loading-wrap" id="loading-wrap">
  <div class="spinner"></div>
  Cargando…
</div>

<!-- CONTENIDO (oculto hasta que cargue) -->
<div class="hub-wrap" id="hub-wrap" style="display:none">
  <div class="hub-greeting">
    <h1 id="saludo">Hola</h1>
    <p>¿A qué aplicación quieres acceder?</p>
  </div>

  <div class="apps-grid" id="apps-grid">

    <!-- Agenda — visible para todas -->
    <a class="app-card" href="agenda/index.html">
      <div class="app-card-icon agenda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="8" y1="14" x2="8.01" y2="14"/>
          <line x1="12" y1="14" x2="12.01" y2="14"/>
          <line x1="16" y1="14" x2="16.01" y2="14"/>
          <line x1="8" y1="18" x2="8.01" y2="18"/>
          <line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
      </div>
      <div class="app-card-titulo">Agenda</div>
      <div class="app-card-desc">Gestiona citas, pacientes y sesiones del día a día.</div>
      <div class="app-card-cta">
        Abrir agenda
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </a>

    <!-- Gestión — solo admins, se inyecta por JS -->

  </div>
</div>

<div class="hub-footer">IPSE · Sistema de gestión v2</div>

<script>
/* ─────────────────────────────────────────
   Configuración Supabase
───────────────────────────────────────── */
const SUPA_URL = 'https://vlplebjqhufbzfncrawf.supabase.co';
const SUPA_KEY = 'sb_publishable_Qt604gEH_lfx89HkPElvcA_OGwbKeDO';

/* ─────────────────────────────────────────
   Helpers fetch Supabase
───────────────────────────────────────── */
async function supaGet(endpoint, token) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${endpoint}`, {
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    }
  });
  if (!res.ok) throw new Error(`Supabase error ${res.status}`);
  return res.json();
}

/* ─────────────────────────────────────────
   Cerrar sesión
───────────────────────────────────────── */
async function cerrarSesion() {
  try {
    const raw = localStorage.getItem('ipse_sesion');
    if (raw) {
      const sesion = JSON.parse(raw);
      // Invalidar token en Supabase
      await fetch(`${SUPA_URL}/auth/v1/logout`, {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${sesion.access_token}`
        }
      });
    }
  } catch { /* si falla el logout remoto, no bloqueamos */ }
  localStorage.removeItem('ipse_sesion');
  window.location.href = 'index.html';
}

/* ─────────────────────────────────────────
   Inicializar hub
───────────────────────────────────────── */
async function init() {
  // 1. Verificar sesión local
  let sesion;
  try {
    const raw = localStorage.getItem('ipse_sesion');
    if (!raw) throw new Error('sin sesión');
    sesion = JSON.parse(raw);
    if (!sesion.access_token || sesion.expires_at < Date.now() + 60_000) {
      throw new Error('sesión caducada');
    }
  } catch {
    window.location.href = 'index.html';
    return;
  }

  // 2. Cargar datos del profesional desde Supabase
  let profesional;
  try {
    const datos = await supaGet(
      `profesionales?auth_user_id=eq.${sesion.user_id}&select=nombre,apellidos,es_admin`,
      sesion.access_token
    );
    if (!datos || datos.length === 0) throw new Error('profesional no encontrado');
    profesional = datos[0];
  } catch (err) {
    console.error('Error cargando profesional:', err);
    // Si falla la consulta, mostramos hub básico sin admin
    profesional = { nombre: sesion.email.split('@')[0], apellidos: '', es_admin: 'No' };
  }

  // 3. Actualizar UI — topbar
  const nombre = profesional.nombre || '';
  const apellidos = profesional.apellidos || '';
  const nombreCorto = nombre.split(' ')[0]; // solo primer nombre
  document.getElementById('topbar-nombre').textContent = `${nombre} ${apellidos}`.trim();
  document.getElementById('topbar-avatar').textContent =
    (nombre[0] || '') + (apellidos[0] || '');
  document.getElementById('saludo').textContent = `Hola, ${nombreCorto} 👋`;

  // 4. Si es admin, añadir card de Gestión
  if (profesional.es_admin === 'Si') {
    const grid = document.getElementById('apps-grid');
    const cardGestion = document.createElement('a');
    cardGestion.className = 'app-card gestion-card';
    cardGestion.href = 'gestion/index.html';
    cardGestion.innerHTML = `
      <div class="app-card-icon gestion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
      </div>
      <div class="app-card-titulo">Gestión</div>
      <div class="app-card-desc">Panel administrativo: facturación, cobros, informes y configuración.</div>
      <div class="app-card-cta">
        Abrir gestión
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    `;
    grid.appendChild(cardGestion);
  }

  // 5. Mostrar contenido
  document.getElementById('loading-wrap').style.display = 'none';
  document.getElementById('hub-wrap').style.display = 'flex';
}

init();
</script>

</body>
</html>
